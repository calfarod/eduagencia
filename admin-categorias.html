  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div data-include="partials/header.html">Cargando navegación…</div>
    <main id="contenido" class="page-content">
      <div class="container">
        <p class="eyebrow">Backoffice · Prototipo visual</p>
        <h1>Administrar categorías</h1>
        <nav class="admin-nav" aria-label="Secciones de administración">
          <a href="admin-categorias.html" aria-current="page">Categorías</a>
          <a href="admin-productos.html">Productos</a>
          <a href="admin-comisiones.html">Comisiones</a>
          <a href="admin-metricas.html">Métricas</a>
        </nav>
        <div class="notice" role="note"><p>Solo maqueta: no guarda cambios ni aplica permisos. El control de acceso requiere autenticación y backend.</p></div>
        <section class="form-panel section-spaced" aria-labelledby="category-title">
          <h2 id="category-title">Nueva categoría</h2>
          <form class="form-fields">
            <div class="form-field"><label for="category-name">Nombre</label><input id="category-name" disabled></div>
            <div class="form-field"><label for="category-parent">Categoría padre</label><select id="category-parent" disabled><option>Sin categoría padre</option></select></div>
            <div class="form-field"><label for="category-slug">Slug</label><input id="category-slug" disabled></div>
            <div class="form-field form-field--check"><input id="category-visible" type="checkbox" disabled><label for="category-visible">Visible</label></div>
            <button class="button" type="button" disabled>Guardado no disponible</button>
          </form>
        </section>
      </div>
    </main>
    <div data-include="partials/footer.html">Cargando pie de página…</div>
